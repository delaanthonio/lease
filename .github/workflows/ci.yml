name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build -o "$RUNNER_TEMP/lease" ./cmd/lease
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Smoke test
        run: |
          export LEASE_STATE_DIR="$RUNNER_TEMP/lease-state"
          "$RUNNER_TEMP/lease" version
          "$RUNNER_TEMP/lease" config
          "$RUNNER_TEMP/lease" run smoke -- sh -c 'touch "$RUNNER_TEMP/lease-ready"; sleep 30' &
          holder=$!
          trap 'kill "$holder" 2>/dev/null || true' EXIT
          while [ ! -f "$RUNNER_TEMP/lease-ready" ]; do
            kill -0 "$holder"
            sleep 0.1
          done
          if "$RUNNER_TEMP/lease" run smoke --no-wait -- echo nope; then
            echo "busy run unexpectedly succeeded"
            exit 1
          fi
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
